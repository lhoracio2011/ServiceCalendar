product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.sqlite.bundled
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.datetime
  - $libs.kotlinx.serialization.json
  - $libs.ktor.client.core

dependencies@android:
  - $libs.androidx.activity.compose
  - $compose.uiTooling
  - $libs.ktor.client.okhttp

dependencies@ios:
  - $libs.ktor.client.darwin

test-dependencies:
  - $libs.ktor.client.mock

settings:
  jvm:
    test:
      # JVM database tests load native SQLite; JDK 22+ requires native access to be enabled.
      freeJvmArgs: [--enable-native-access=ALL-UNNAMED]
  kotlin:
    serialization:
      format: json
      # Must match kotlinx-serialization in libs.versions.toml.
      version: 1.12.0
  compose:
    enabled: true
    resources:
      packageName: app.servicecalendar.resources
      exposedAccessors: true
